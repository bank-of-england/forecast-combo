name: Create GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to release, for example v0.1.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  quality:
    name: Run package quality checks
    uses: ./.github/workflows/package-quality.yml
    with:
      ref: ${{ inputs.release_tag || github.ref }}
    permissions:
      contents: read

  release:
    name: Create release
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; continuing with downstream jobs."
          else
            gh release create "$tag" --title "forecast-combo $tag" --generate-notes --verify-tag
          fi

  publish:
    name: Publish package to PyPI
    needs: release
    uses: ./.github/workflows/publish-pypi.yml
    with:
      ref: ${{ inputs.release_tag || github.ref }}
    permissions:
      contents: read
      id-token: write

  documentation:
    name: Deploy documentation
    needs: release
    uses: ./.github/workflows/deploy-docs.yml
    with:
      ref: ${{ inputs.release_tag || github.ref }}
    permissions:
      contents: read
      pages: write
      id-token: write
